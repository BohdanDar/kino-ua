<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кіно українською</title>
<meta name="description" content="Сеанси українською мовою в кінотеатрах Вроцлава">
<meta name="theme-color" content="#0b5cad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кіно UA">
<link rel="stylesheet" href="fonts.css?v=__V__">
<link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-text">
      <span class="flag"><i></i><i></i></span>
      <h1>Кіно українською у Вроцлаві</h1>
    </div>
    <a id="alert" class="alert" href="#status" hidden aria-label="Є проблеми, що потребують уваги" title="Є проблеми, що потребують уваги">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3 2 20h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="currentColor"/></svg>
      <span id="alert-n"></span>
    </a>
  </header>
  <div id="home">
  <div id="news" hidden></div>
  <form id="search" role="search" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" aria-label="Запит"
           placeholder="завтра, субота, 25.10, з 20 по 25, Веріті, Multikino">
  </form>
  <nav class="chips" aria-label="Швидкий вибір">
    <button data-q="сьогодні">Сьогодні</button>
    <button data-q="завтра">Завтра</button>
    <button data-q="вихідні">Вихідні</button>
    <button data-q="тиждень">Тиждень</button>
    <button data-q="усі">Усі 2 тижні</button>
  </nav>
  <div class="subrow">
    <p id="sub" class="sub"></p>
    <button id="share-all" class="share-all" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Поділитися списком
    </button>
  </div>
  <main id="out"></main>
  </div>
  <section id="status" hidden>
    <a class="back" href="#">← До розкладу</a>
    <h2>Що потребує уваги</h2>
    <div id="problems"></div>
  </section>
  <footer id="foot"></footer>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="app.js?v=__V__"></script>
</body>
</html>
