<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кіно українською</title>
<meta name="description" content="Сеанси українською мовою в кінотеатрах Вроцлава">
<meta name="theme-color" content="#0b5cad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кіно UA">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <span class="flag"><i></i><i></i></span>
    <h1>Кіно українською у Вроцлаві</h1>
  </header>
  <a id="alert" class="alert" href="#status" hidden aria-label="Є проблеми, що потребують уваги" title="Є проблеми, що потребують уваги">!</a>
  <div id="home">
  <form id="search" role="search" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" aria-label="Запит"
           placeholder="завтра, субота, 25.10, з 20 по 25, Веріті, Multikino">
  </form>
  <nav class="chips" aria-label="Швидкий вибір">
    <button data-q="сьогодні">Сьогодні</button>
    <button data-q="завтра">Завтра</button>
    <button data-q="вихідні">Вихідні</button>
    <button data-q="тиждень">Тиждень</button>
    <button data-q="усі">Усі 2 тижні</button>
  </nav>
  <p id="sub" class="sub"></p>
  <main id="out"></main>
  </div>
  <section id="status" hidden>
    <a class="back" href="#">← До розкладу</a>
    <h2>Що потребує уваги</h2>
    <div id="problems"></div>
  </section>
  <footer id="foot"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
