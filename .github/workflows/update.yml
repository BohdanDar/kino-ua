# Кожні 2 години збирає розклад на 14 днів і публікує застосунок на GitHub Pages.
# Запускається також після кожного Merge у main і вручну (Actions → Run workflow).
name: Оновити розклад

on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # кеш назв, описів і українських перекладів між запусками
      - uses: actions/cache@v4
        with:
          path: .kino_cache.json
          key: kino-cache-${{ github.run_id }}
          restore-keys: kino-cache-

      - name: Зібрати сеанси на 14 днів
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 build.py 14

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
