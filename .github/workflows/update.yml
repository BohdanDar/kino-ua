# Кожні 2 години збирає розклад на 14 днів і публікує застосунок на GitHub Pages.
# Запускається також після кожного Merge у main і вручну (Actions → Run workflow).
# Дії закріплені за точним відбитком коміту (у коментарі версія), щоб їх не могли тихо підмінити.
name: Оновити розклад

on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # кеш назв, описів і українських перекладів між запусками
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kino_cache.json
          key: kino-cache-${{ github.run_id }}
          restore-keys: kino-cache-

      # помилка в коді застосунку не має потрапити на сайт: тоді запуск зупиняється, а сайт лишається старим
      - name: Перевірити код застосунку
        run: |
          node --check site/app.js
          node --check site/sw.js
          python3 -m json.tool site/manifest.webmanifest > /dev/null

      - name: Зібрати сеанси на 14 днів
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python3 build.py 14

      # нова адреса app.js/style.css з кожною версією: браузер не візьме стару копію зі свого кешу
      - name: Позначити версію файлів
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # GitHub вимикає розклад у репозиторії без змін за 60 днів; повторне ввімкнення це скидає.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Не дати GitHub вимкнути розклад
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

  # Кожен запуск зберігає памʼять робота (кеш) під новою назвою; старі копії не потрібні,
  # тож лишаємо лише найсвіжішу, щоб список кешів у Actions → Caches не розростався.
  tidy-cache:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF: ${{ github.ref }}
    steps:
      - name: Видалити старі копії кешу
        run: |
          gh cache list -R "$REPO" --key kino-cache- --ref "$REF" --sort created_at --order desc \
            --limit 100 --json id --jq '.[1:][].id' | xargs -r -n1 gh cache delete -R "$REPO"
